services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ficharentrada-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]

  postgres:
    image: postgres:16-alpine
    container_name: ficharentrada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ficharentrada
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ficharentrada"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
